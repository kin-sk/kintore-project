<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta name="theme-color" content="#13161B" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&display=swap" />
    <title>筋トレ記録</title>
    <style>
      /* 起動アニメ（アプリ版のみ）。Android の起動画面（タイル付きバーベル）からそのまま続く */
      #intro { position: fixed; inset: 0; z-index: 9999; background: #13161b; pointer-events: none;
        --d: 1.9s; animation: introOut var(--d) both; }
      #intro[hidden] { display: none; }
      #intro .tile { position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; margin: -48px 0 0 -48px;
        border-radius: 26px; background: #1c2027; display: grid; place-items: center; animation: introTile var(--d) both; }
      #intro .tile svg { width: 64px; height: 64px; }
      #intro .bell { position: absolute; left: 50%; top: calc(50% - 24px); width: 0; height: 0; animation: introLift var(--d) both; }
      #intro .bar { position: absolute; left: -100px; top: -4px; width: 200px; height: 8px; border-radius: 4px; background: #c3cad4;
        animation: introBar var(--d) both; }
      #intro .pl { position: absolute; border-radius: 5px; }
      #intro .in  { width: 15px; height: 62px; top: -31px; background: #4c8dff; }
      #intro .out { width: 12px; height: 46px; top: -23px; background: #8fb8ff; }
      #intro .in.l  { left: -70px; animation: introInL var(--d) both; }
      #intro .in.r  { left: 55px;  animation: introInR var(--d) both; }
      #intro .out.l { left: -85px; animation: introOutL var(--d) both; }
      #intro .out.r { left: 73px;  animation: introOutR var(--d) both; }
      #intro .txt { position: absolute; left: 0; right: 0; top: calc(50% + 30px); text-align: center; color: #e8ecf1;
        font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-style: italic; font-weight: 700;
        font-size: 44px; letter-spacing: .06em; animation: introText var(--d) both; }
      @keyframes introOut  { 0%, 84% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes introTile { 0%, 8% { opacity: 1; transform: none } 18%, 100% { opacity: 0; transform: scale(.6) } }
      @keyframes introBar  { 0%, 10% { transform: scaleX(0) } 24%, 100% { transform: scaleX(1) } }
      @keyframes introInL  { 0%, 24% { transform: translateX(-140px); opacity: 0 } 26% { opacity: 1 } 32% { transform: translateX(5px) } 35%, 100% { transform: none; opacity: 1 } }
      @keyframes introInR  { 0%, 24% { transform: translateX(140px);  opacity: 0 } 26% { opacity: 1 } 32% { transform: translateX(-5px) } 35%, 100% { transform: none; opacity: 1 } }
      @keyframes introOutL { 0%, 31% { transform: translateX(-150px); opacity: 0 } 33% { opacity: 1 } 39% { transform: translateX(4px) } 42%, 100% { transform: none; opacity: 1 } }
      @keyframes introOutR { 0%, 31% { transform: translateX(150px);  opacity: 0 } 33% { opacity: 1 } 39% { transform: translateX(-4px) } 42%, 100% { transform: none; opacity: 1 } }
      @keyframes introLift { 0%, 46% { transform: none } 54%, 61% { transform: translateY(-20px) } 69%, 100% { transform: none } }
      @keyframes introText { 0%, 55% { opacity: 0; transform: translateY(10px) } 70%, 100% { opacity: 1; transform: none } }
    </style>
  </head>
  <body>
    <div id="intro" hidden aria-hidden="true">
      <div class="tile">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="2" fill="#c3cad4"/><rect x="5" y="6" width="2.5" height="12" fill="#4c8dff"/><rect x="16.5" y="6" width="2.5" height="12" fill="#4c8dff"/><rect x="2.6" y="8" width="2" height="8" fill="#8fb8ff"/><rect x="19.4" y="8" width="2" height="8" fill="#8fb8ff"/></svg>
      </div>
      <div class="bell">
        <div class="bar"></div>
        <div class="pl in l"></div><div class="pl in r"></div>
        <div class="pl out l"></div><div class="pl out r"></div>
      </div>
      <div class="txt">KINTORE</div>
    </div>
    <script>
      // アプリ版（Capacitor は https://localhost で配信）だけで起動アニメを再生。Web 版では何もしない
      (function () {
        var el = document.getElementById('intro')
        var cap = window.Capacitor
        var native = (cap && cap.isNativePlatform && cap.isNativePlatform()) ||
          (location.protocol === 'https:' && location.hostname === 'localhost')
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        if (!native || reduce) { el.remove(); return }
        el.hidden = false
        setTimeout(function () { el.remove() }, 2000)
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
